name: Build Windows installers

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri installers
        run: npm run tauri -- build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: manga-panel-parser-windows-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $tag = $env:RELEASE_TAG
          $repository = $env:RELEASE_REPOSITORY
          $assets = @(
            (Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi").FullName
            (Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe").FullName
          )

          if ($assets.Count -eq 0) {
            throw "No Windows installers were found for release $tag."
          }

          $null = gh release view $tag --repo $repository 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --repo $repository --clobber
          } else {
            gh release create $tag $assets `
              --repo $repository `
              --title $tag `
              --generate-notes `
              --verify-tag
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed for $tag."
          }
